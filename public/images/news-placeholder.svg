<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C" />
      <stop offset="50%" stop-color="#F2D785" />
      <stop offset="100%" stop-color="#A6832B" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular grid -->
  <circle cx="400" cy="225" r="150" fill="none" stroke="#222" stroke-width="1" opacity="0.3" stroke-dasharray="5 5"/>
  <circle cx="400" cy="225" r="200" fill="none" stroke="#222" stroke-width="1" opacity="0.15"/>
  
  <!-- Premium Accent Lines -->
  <line x1="50" y1="225" x2="150" y2="225" stroke="#222" stroke-width="1" opacity="0.4" />
  <line x1="650" y1="225" x2="750" y2="225" stroke="#222" stroke-width="1" opacity="0.4" />
  
  <!-- Logo/Newspaper Icon in Center -->
  <g transform="translate(400, 175)" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Newspaper shape -->
    <path d="M-30,-25 L10,-25 C15,-25 20,-20 20,-15 L20,25 C20,30 15,35 10,35 L-30,35 C-35,35 -40,30 -40,25 L-40,-15 C-40,-20 -35,-25 -30,-25 Z" />
    <path d="M-20,-25 L-20,35" />
    <path d="M-10,-15 L10,-15" stroke-width="1.5" />
    <path d="M-10,-5 L10,-5" stroke-width="1.5" />
    <path d="M-10,5 L10,5" stroke-width="1.5" />
    <path d="M-10,15 L10,15" stroke-width="1.5" />
    <!-- Small fold at bottom right -->
    <path d="M10,35 C15,35 20,30 20,25 L10,25 L10,35" fill="url(#goldGrad)" opacity="0.2"/>
  </g>
  
  <!-- Text Content -->
  <text x="400" y="275" font-family="'Playfair Display', 'Georgia', serif" font-size="24" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0.1em">KAMMA VOICE</text>
  <text x="400" y="305" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#666" text-anchor="middle" letter-spacing="0.2em">LATEST NEWS • తాజా వార్తలు</text>
  <text x="400" y="325" font-family="'Inter', sans-serif" font-size="10" fill="#444" text-anchor="middle" letter-spacing="0.05em">DIGITAL MEDIA PORTAL</text>
  
  <!-- Subtle gold dot accents -->
  <circle cx="350" cy="301" r="2" fill="#C9A84C" opacity="0.5"/>
  <circle cx="450" cy="301" r="2" fill="#C9A84C" opacity="0.5"/>
</svg>
